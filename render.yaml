services:
  # ---------------------------------------------------------------------------
  # Django Backend API
  # ---------------------------------------------------------------------------
  - type: web
    name: garage-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn platform_config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /api/auth/login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false            # you'll paste your Neon connection string in the dashboard
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://garage-frontend.onrender.com"
      # Subscription billing — Flutterwave redirects back here after payment
      - key: FRONTEND_URL
        value: "https://garage-frontend.onrender.com"
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false            # Flutterwave dashboard → Settings → API keys
      - key: FLUTTERWAVE_WEBHOOK_HASH
        sync: false            # Flutterwave dashboard → Settings → Webhooks (secret hash)
      # MTN Mobile Money Collections (Request to Pay)
      - key: MTN_MOMO_SUBSCRIPTION_KEY
        sync: false            # momodeveloper.mtn.com → Collections → Primary key
      - key: MTN_MOMO_API_USER
        sync: false
      - key: MTN_MOMO_API_KEY
        sync: false
      - key: MTN_MOMO_ENVIRONMENT
        value: "sandbox"       # "mtnuganda" once MTN issues production credentials
      - key: MTN_MOMO_BASE_URL
        value: "https://sandbox.momodeveloper.mtn.com"   # production: https://proxy.momoapi.mtn.com
      - key: MTN_MOMO_CURRENCY
        value: "EUR"           # sandbox only accepts EUR; empty in production (UGX)
      - key: MTN_MOMO_CALLBACK_URL
        value: "https://garage-backend.onrender.com/api/billing/momo/callback"

  # ---------------------------------------------------------------------------
  # Next.js Frontend
  # ---------------------------------------------------------------------------
  - type: web
    name: garage-frontend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm start -- -p $PORT"
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: NEXT_PUBLIC_API_URL
        value: "https://garage-backend.onrender.com/api"


  - type: cron
    name: daily-digest
    runtime: python
    schedule: "0 6 * * *"    # 6 AM UTC = 9 AM EAT
    buildCommand: pip install -r requirements.txt
    startCommand: "python manage.py send_daily_digest; python manage.py send_billing_reminders; python manage.py sync_pending_payments"
    rootDir: backend
    envVars:
      - fromGroup: garage-backend-env